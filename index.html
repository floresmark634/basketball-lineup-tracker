<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketball Lineup Tracker</title>

<style>
* { box-sizing: border-box; }

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f3f4f6;
color: #111827;
}

.app {
max-width: 1100px;
margin: auto;
padding: 20px;
}

h1, h2, h3 { text-align: center; }

.card {
background: white;
border-radius: 14px;
padding: 20px;
margin-bottom: 18px;
box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.hidden { display: none; }

input {
font-size: 18px;
padding: 10px;
margin: 5px;
width: 180px;
}

button {
border: 0;
border-radius: 10px;
padding: 12px 18px;
margin: 5px;
font-size: 18px;
cursor: pointer;
background: #e5e7eb;
}

button:active { transform: scale(.97); }

.primary {
background: #111827;
color: white;
}

.danger {
background: #b91c1c;
color: white;
}

.scoreboard {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 15px;
}

.team {
text-align: center;
background: white;
border-radius: 14px;
padding: 15px;
}

.score {
font-size: 60px;
font-weight: bold;
}

.scoreButtons button {
min-width: 70px;
font-size: 24px;
}

.rosterRow {
display: flex;
justify-content: center;
align-items: center;
flex-wrap: wrap;
}

.starterChoice {
display: inline-block;
margin: 6px;
}

.starterChoice label {
display: block;
padding: 12px;
border: 2px solid #d1d5db;
border-radius: 10px;
cursor: pointer;
}

.onCourt {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: 8px;
}

.playerCard {
text-align: center;
background: #f3f4f6;
padding: 15px 5px;
border-radius: 10px;
}

.playerNumber {
font-weight: bold;
font-size: 20px;
}

.pm {
font-size: 24px;
font-weight: bold;
margin-top: 8px;
}

.lineupStats {
text-align: center;
font-size: 20px;
}

table {
width: 100%;
border-collapse: collapse;
}

th, td {
padding: 10px;
border-bottom: 1px solid #ddd;
text-align: center;
}

.log {
max-height: 180px;
overflow-y: auto;
text-align: left;
}

@media (max-width: 700px) {
.onCourt {
grid-template-columns: repeat(2, 1fr);
}

.scoreboard {
grid-template-columns: 1fr;
}
}
</style>
</head>

<body>

<div class="app">

<h1>🏀 Basketball Lineup Tracker</h1>

<!-- SETUP -->
<div id="setup" class="card">
<h2>1. Create Roster</h2>

<div id="rosterInputs"></div>

<button onclick="addRosterRow()">+ Add Player</button>
<button class="primary" onclick="goToStarters()">Choose Starting 5</button>
</div>

<!-- STARTERS -->
<div id="starterSetup" class="card hidden">
<h2>2. Choose Starting 5</h2>

<div id="starterChoices"></div>

<p style="text-align:center">
Selected: <strong id="starterCount">0</strong> / 5
</p>

<div style="text-align:center">
<button onclick="backToRoster()">Back</button>
<button class="primary" onclick="startGame()">Start Game</button>
</div>
</div>

<!-- GAME -->
<div id="game" class="hidden">

<div class="scoreboard">

<div class="team">
<h2>Our Team</h2>
<div id="ourScore" class="score">0</div>

<div class="scoreButtons">
<button onclick="recordScore('us',1)">+1</button>
<button onclick="recordScore('us',2)">+2</button>
<button onclick="recordScore('us',3)">+3</button>
</div>
</div>

<div class="team">
<h2>Opponent</h2>
<div id="theirScore" class="score">0</div>

<div class="scoreButtons">
<button onclick="recordScore('them',1)">+1</button>
<button onclick="recordScore('them',2)">+2</button>
<button onclick="recordScore('them',3)">+3</button>
</div>
</div>

</div>

<div class="card">
<h2>Players On Court</h2>
<div id="onCourt" class="onCourt"></div>
</div>

<div class="card">
<h2>Current Lineup</h2>
<div id="currentLineupStats" class="lineupStats"></div>
</div>

<div class="card">
<h2>Substitution</h2>

<div style="text-align:center">
<select id="playerOut" style="font-size:18px;padding:10px"></select>
<span> OUT → </span>
<select id="playerIn" style="font-size:18px;padding:10px"></select>

<button class="primary" onclick="makeSub()">Make Sub</button>
</div>
</div>

<div class="card">
<h2>Player +/-</h2>

<table>
<thead>
<tr>
<th>#</th>
<th>Player</th>
<th>+/-</th>
</tr>
</thead>

<tbody id="playerStats"></tbody>
</table>
</div>

<div class="card">
<h2>Lineup Results</h2>

<table>
<thead>
<tr>
<th>Lineup</th>
<th>PF</th>
<th>PA</th>
<th>+/-</th>
</tr>
</thead>

<tbody id="lineupTable"></tbody>
</table>
</div>

<div class="card">
<h2>Game Log</h2>

<div id="gameLog" class="log"></div>

<div style="text-align:center">
<button onclick="undoLast()">↶ Undo Last Action</button>
</div>
</div>

</div>

</div>

<script>

let roster = [];
let onCourt = [];
let ourScore = 0;
let theirScore = 0;

let lineups = {};
let history = [];
let gameLog = [];

function addRosterRow(number = "", name = "") {
const container = document.getElementById("rosterInputs");

const row = document.createElement("div");
row.className = "rosterRow";

row.innerHTML = `
<input class="numberInput" placeholder="#" value="${number}">
<input class="nameInput" placeholder="Player name" value="${name}">
<button onclick="this.parentElement.remove()">Remove</button>
`;

container.appendChild(row);
}

for (let i = 0; i < 10; i++) {
addRosterRow();
}

function buildRoster() {
const numbers = document.querySelectorAll(".numberInput");
const names = document.querySelectorAll(".nameInput");

roster = [];

for (let i = 0; i < names.length; i++) {
const name = names[i].value.trim();
const number = numbers[i].value.trim();

if (name !== "") {
roster.push({
id: Date.now() + i,
number: number,
name: name,
plusMinus: 0
});
}
}
}

function goToStarters() {
buildRoster();

if (roster.length < 5) {
alert("You need at least 5 players.");
return;
}

document.getElementById("setup").classList.add("hidden");
document.getElementById("starterSetup").classList.remove("hidden");

renderStarterChoices();
}

function backToRoster() {
document.getElementById("starterSetup").classList.add("hidden");
document.getElementById("setup").classList.remove("hidden");
}

function renderStarterChoices() {
const area = document.getElementById("starterChoices");
area.innerHTML = "";

roster.forEach(player => {
const box = document.createElement("div");
box.className = "starterChoice";

box.innerHTML = `
<label>
<input type="checkbox"
class="starterCheck"
value="${player.id}"
onchange="starterChanged(this)">
#${player.number} ${player.name}
</label>
`;

area.appendChild(box);
});

updateStarterCount();
}

function starterChanged(changedBox) {
const checked = document.querySelectorAll(".starterCheck:checked");

if (checked.length > 5) {
changedBox.checked = false;
alert("You can only select 5 starters.");
}

updateStarterCount();
}

function updateStarterCount() {
const count = document.querySelectorAll(".starterCheck:checked").length;
document.getElementById("starterCount").textContent = count;
}

function startGame() {
const checked = [...document.querySelectorAll(".starterCheck:checked")];

if (checked.length !== 5) {
alert("Select exactly 5 starters.");
return;
}

onCourt = checked.map(box => Number(box.value));

ourScore = 0;
theirScore = 0;
lineups = {};
history = [];
gameLog = [];

roster.forEach(p => p.plusMinus = 0);

document.getElementById("starterSetup").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");

ensureCurrentLineup();
renderGame();
}

function currentPlayers() {
return onCourt.map(id => roster.find(p => p.id === id));
}

function lineupKey() {
return [...onCourt].sort((a,b) => a-b).join("-");
}

function ensureCurrentLineup() {
const key = lineupKey();

if (!lineups[key]) {
lineups[key] = {
playerIds: [...onCourt],
pointsFor: 0,
pointsAgainst: 0
};
}
}

function saveHistory() {
history.push(JSON.stringify({
roster: roster,
onCourt: onCourt,
ourScore: ourScore,
theirScore: theirScore,
lineups: lineups,
gameLog: gameLog
}));
}

function recordScore(team, points) {
saveHistory();
ensureCurrentLineup();

const key = lineupKey();

if (team === "us") {
ourScore += points;
lineups[key].pointsFor += points;

currentPlayers().forEach(player => {
player.plusMinus += points;
});

gameLog.unshift(`Our Team +${points}`);
} else {
theirScore += points;
lineups[key].pointsAgainst += points;

currentPlayers().forEach(player => {
player.plusMinus -= points;
});

gameLog.unshift(`Opponent +${points}`);
}

renderGame();
}

function makeSub() {
const outId = Number(document.getElementById("playerOut").value);
const inId = Number(document.getElementById("playerIn").value);

if (!outId || !inId) {
alert("Choose a player out and a player in.");
return;
}

saveHistory();

const outPlayer = roster.find(p => p.id === outId);
const inPlayer = roster.find(p => p.id === inId);

const index = onCourt.indexOf(outId);

if (index === -1) return;

onCourt[index] = inId;

ensureCurrentLineup();

gameLog.unshift(
`SUB: #${outPlayer.number} ${outPlayer.name} OUT — #${inPlayer.number} ${inPlayer.name} IN`
);

renderGame();
}

function undoLast() {
if (history.length === 0) {
alert("Nothing to undo.");
return;
}

const previous = JSON.parse(history.pop());

roster = previous.roster;
onCourt = previous.onCourt;
ourScore = previous.ourScore;
theirScore = previous.theirScore;
lineups = previous.lineups;
gameLog = previous.gameLog;

renderGame();
}

function formatPM(value) {
if (value > 0) return "+" + value;
return value;
}

function renderGame() {
document.getElementById("ourScore").textContent = ourScore;
document.getElementById("theirScore").textContent = theirScore;

renderOnCourt();
renderSubs();
renderPlayerStats();
renderLineups();
renderLog();
renderCurrentLineup();
}

function renderOnCourt() {
const area = document.getElementById("onCourt");
area.innerHTML = "";

currentPlayers().forEach(player => {
const div = document.createElement("div");
div.className = "playerCard";

div.innerHTML = `
<div class="playerNumber">#${player.number}</div>
<div>${player.name}</div>
<div class="pm">${formatPM(player.plusMinus)}</div>
`;

area.appendChild(div);
});
}

function renderSubs() {
const outSelect = document.getElementById("playerOut");
const inSelect = document.getElementById("playerIn");

outSelect.innerHTML = `<option value="">Player Out</option>`;
inSelect.innerHTML = `<option value="">Player In</option>`;

currentPlayers().forEach(player => {
outSelect.innerHTML += `
<option value="${player.id}">
#${player.number} ${player.name}
</option>
`;
});

roster
.filter(player => !onCourt.includes(player.id))
.forEach(player => {
inSelect.innerHTML += `
<option value="${player.id}">
#${player.number} ${player.name}
</option>
`;
});
}

function renderPlayerStats() {
const body = document.getElementById("playerStats");
body.innerHTML = "";

[...roster]
.sort((a,b) => b.plusMinus - a.plusMinus)
.forEach(player => {
body.innerHTML += `
<tr>
<td>#${player.number}</td>
<td>${player.name}</td>
<td>${formatPM(player.plusMinus)}</td>
</tr>
`;
});
}

function renderLineups() {
const body = document.getElementById("lineupTable");
body.innerHTML = "";

Object.values(lineups)
.sort((a,b) =>
(b.pointsFor - b.pointsAgainst) -
(a.pointsFor - a.pointsAgainst)
)
.forEach(lineup => {

const names = lineup.playerIds
.map(id => {
const p = roster.find(player => player.id === id);
return p ? `#${p.number}` : "";
})
.join(", ");

const pm = lineup.pointsFor - lineup.pointsAgainst;

body.innerHTML += `
<tr>
<td>${names}</td>
<td>${lineup.pointsFor}</td>
<td>${lineup.pointsAgainst}</td>
<td>${formatPM(pm)}</td>
</tr>
`;
});
}

function renderCurrentLineup() {
ensureCurrentLineup();

const lineup = lineups[lineupKey()];
const pm = lineup.pointsFor - lineup.pointsAgainst;

document.getElementById("currentLineupStats").innerHTML = `
Points For: <strong>${lineup.pointsFor}</strong>
&nbsp; | &nbsp;
Points Against: <strong>${lineup.pointsAgainst}</strong>
&nbsp; | &nbsp;
+/-: <strong>${formatPM(pm)}</strong>
`;
}

function renderLog() {
const log = document.getElementById("gameLog");

if (gameLog.length === 0) {
log.innerHTML = "<p>No actions yet.</p>";
return;
}

log.innerHTML = gameLog
.map(item => `<p>${item}</p>`)
.join("");
}

</script>

</body>
</html>
