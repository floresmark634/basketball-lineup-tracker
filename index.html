<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketball Lineup Tracker</title>

<style>
body {
font-family: Arial, sans-serif;
margin: 0;
background: #f4f4f4;
text-align: center;
}

.app {
max-width: 900px;
margin: auto;
padding: 30px;
}

h1 {
margin-bottom: 30px;
}

.scoreboard {
display: flex;
justify-content: space-around;
gap: 20px;
}

.team {
background: white;
padding: 25px;
border-radius: 15px;
flex: 1;
}

.score {
font-size: 64px;
font-weight: bold;
margin: 15px;
}

button {
font-size: 24px;
padding: 15px 25px;
margin: 5px;
border-radius: 10px;
cursor: pointer;
}

.court {
margin-top: 30px;
background: white;
padding: 25px;
border-radius: 15px;
}

.players {
display: flex;
justify-content: center;
flex-wrap: wrap;
gap: 10px;
}

.player {
padding: 15px;
background: #eeeeee;
border-radius: 10px;
min-width: 100px;
}

.plusminus {
font-size: 20px;
font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

<h1>🏀 Basketball Lineup Tracker</h1>

<div class="scoreboard">

<div class="team">
<h2>Our Team</h2>

<div class="score" id="ourScore">0</div>

<button onclick="scoreUs(1)">+1</button>
<button onclick="scoreUs(2)">+2</button>
<button onclick="scoreUs(3)">+3</button>
</div>

<div class="team">
<h2>Opponent</h2>

<div class="score" id="theirScore">0</div>

<button onclick="scoreThem(1)">+1</button>
<button onclick="scoreThem(2)">+2</button>
<button onclick="scoreThem(3)">+3</button>
</div>

</div>

<div class="court">

<h2>Players On Court</h2>

<div class="players">

<div class="player">
#2 Smith
<div class="plusminus" id="p1">0</div>
</div>

<div class="player">
#4 Jones
<div class="plusminus" id="p2">0</div>
</div>

<div class="player">
#11 Brown
<div class="plusminus" id="p3">0</div>
</div>

<div class="player">
#15 Davis
<div class="plusminus" id="p4">0</div>
</div>

<div class="player">
#23 Wilson
<div class="plusminus" id="p5">0</div>
</div>

</div>

</div>

</div>

<script>

let ourScore = 0;
let theirScore = 0;

let plusMinus = [0, 0, 0, 0, 0];

function scoreUs(points) {

ourScore += points;

plusMinus = plusMinus.map(value => value + points);

updateScreen();
}

function scoreThem(points) {

theirScore += points;

plusMinus = plusMinus.map(value => value - points);

updateScreen();
}

function updateScreen() {

document.getElementById("ourScore").textContent = ourScore;
document.getElementById("theirScore").textContent = theirScore;

for (let i = 0; i < 5; i++) {

let value = plusMinus[i];

document.getElementById("p" + (i + 1)).textContent =
value > 0 ? "+" + value : value;
}
}

</script>

</body>
</html>
